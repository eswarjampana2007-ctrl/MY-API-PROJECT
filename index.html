<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Zerodha</title>
</head>

<body>
    <header class="site-header">
        <a href="https://zerodha.com/" aria-label="Zerodha home">
            <img class="logo" src="https://zerodha.com/static/images/logo.svg" alt="Zerodha">
        </a>
        <nav class="top-nav" aria-label="Main navigation">
            <a href="https://zerodha.com/open-account/" target="_blank" rel="noopener noreferrer">Sign Up</a>
            <a href="https://zerodha.com/about/" target="_blank" rel="noopener noreferrer">About</a>
            <a href="https://zerodha.com/products/" target="_blank" rel="noopener noreferrer">Products</a>
            <a href="https://zerodha.com/charges/#tab-equities" target="_blank" rel="noopener noreferrer">Pricing</a>
            <a href="https://support.zerodha.com/" target="_blank" rel="noopener noreferrer">Support</a>
        </nav>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-copy">
                <h1 id="hero-title">Invest in everything</h1>
                <p>Online platform for investing in stocks, options, futures, and more.</p>
                <a class="signup-cta" href="https://zerodha.com/open-account/">Sign Up For Free</a>
            </div>
            <img class="landing-image" src="https://zerodha.com/static/images/landing.svg"
                alt="Zerodha trading dashboard">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/aRGdDy18qfY?si=bwKioJtZ3yKG67di" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        </section>
    </main>
</body>
<div class="video-container">
    
</div

</html>
